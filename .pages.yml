media:
  input: assets/images
  output: /assets/images
content:
  - name: home
    label: Home page
    type: file
    path: index.html
    fields:
      - { name: layout, type: string, hidden: true, default: default }
      - { name: title, label: Title in browser tab, type: string }
      - { name: body, label: Page content (HTML), type: code, options: { format: html } }
  - name: mentorship
    label: Mentorship page
    type: file
    path: privatementorship/index.html
    fields:
      - { name: layout, type: string, hidden: true, default: default }
      - { name: title, label: Title in browser tab, type: string }
      - { name: description, label: Search engine description, type: text }
      - { name: body, label: Page content (HTML), type: code, options: { format: html } }
  - name: application
    label: Application page
    type: file
    path: apply/index.html
    fields:
      - { name: layout, type: string, hidden: true, default: default }
      - { name: title, label: Title in browser tab, type: string }
      - { name: description, label: Search engine description, type: text }
      - { name: body, label: Page content (HTML), type: code, options: { format: html } }
  - name: settings
    label: Contact and prices
    type: file
    path: _data/settings.yml
    format: yaml
    fields:
      - { name: email, label: Email address, type: string }
      - { name: whatsapp_display, label: WhatsApp number (as shown), type: string }
      - { name: whatsapp_number, label: WhatsApp number (digits only, with country code), type: string }
      - { name: instagram, label: Instagram link, type: string }
      - { name: facebook, label: Facebook link, type: string }
      - { name: location, label: Where you are based, type: string }
      - { name: languages, label: Session languages, type: string }
      - { name: free_sessions, label: Number of free sessions (in words), type: string }
      - { name: fee, label: Mentorship fee, type: string }
      - { name: typical_sessions, label: Typical number of sessions, type: string }
  - name: philosophy
    label: Philosophy page
    type: file
    path: philosophy/index.md
    fields:
      - { name: layout, type: string, hidden: true, default: page }
      - { name: title, label: Title in browser tab, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: description, label: Search engine description, type: text }
      - { name: image, label: Image, type: image }
      - { name: image_alt, label: Image description, type: string }
      - { name: image_caption, label: Image caption, type: string }
      - { name: image_side, type: string, hidden: true, default: left }
      - { name: body, label: Text, type: rich-text }
  - name: about
    label: About page
    type: file
    path: about/index.md
    fields:
      - { name: layout, type: string, hidden: true, default: page }
      - { name: title, label: Title in browser tab, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: description, label: Search engine description, type: text }
      - { name: image, label: Image, type: image }
      - { name: image_alt, label: Image description, type: string }
      - { name: image_caption, label: Image caption, type: string }
      - { name: image_side, type: string, hidden: true, default: right }
      - { name: body, label: Text, type: rich-text }
